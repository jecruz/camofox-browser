services:
  camofox-browser:
    build:
      context: .
    image: camofox-browser:latest
    container_name: camofox-browser
    ports:
      # Loopback only: the API has no auth on browsing endpoints (Redmine #2137).
      - "127.0.0.1:9377:3000"
    environment:
      - CAMOFOX_PORT=3000
      - NODE_ENV=production
      - MAX_OLD_SPACE_SIZE=512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
